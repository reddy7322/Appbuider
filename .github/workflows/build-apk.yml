name: Build TVTelugu APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository
        run: |
          echo "Repository contents:"
          find . -maxdepth 3 -type f | sort

      - name: Extract Android project
        run: |
          mkdir -p tvtelugu-project
          unzip -o TVTelugu_IPTV_Pro.zip -d tvtelugu-project

          echo "Extracted project:"
          find tvtelugu-project -maxdepth 4 -type f | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Gradle project
        working-directory: tvtelugu-project
        run: |
          echo "Project root:"
          pwd
          echo "Project files:"
          ls -la
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -d app

      - name: Build TVTelugu APK
        working-directory: tvtelugu-project
        run: |
          gradle assembleDebug --stacktrace

      - name: Show generated APK
        run: |
          find tvtelugu-project -type f -name "*.apk" -print

      - name: Upload TVTelugu APK
        uses: actions/upload-artifact@v4
        with:
          name: TVTelugu-APK
          path: tvtelugu-project/app/build/outputs/apk/debug/app-debug.apk
